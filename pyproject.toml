[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-residence"
version = "1.0.0"
description = "Estimation and use of residence-occupation matrices from mobile-phone sensing data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "L. Leticia Ramírez-Ramírez"},
  {name = "José A. Montoya"},
  {name = "Jesús F. Espinoza"},
  {name = "Chahak Mehta"},
  {name = "Albert Orwa Akuno"},
  {name = "Tan Bui-Thanh"},
]
dependencies = [
  "geopandas>=0.14,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyogrio>=0.7,<1",
  "pyproj>=3.6,<4",
  "scipy>=1.11,<2",
  "shapely>=2,<3",
  "tzdata>=2024.1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
cloud = ["google-cloud-bigquery>=3.17,<4"]
test = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
time-residence = "time_residence.cli:main"

[project.urls]
Article = "https://doi.org/10.1007/s43762-025-00168-y"
Repository = "https://github.com/residence-occupation-matrices/time-residence"
Archive = "https://doi.org/10.5281/zenodo.11390633"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
